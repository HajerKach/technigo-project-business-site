<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Site</title>
  <!-- Don't forget to link the CSS file here! -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="hero">
    <div class="hero-card">
      <h1>Bokcirkel 2026</h1>
      <p>Upptäck nya berättelser tillsammans med andra bokälskare</p>
      <button class="hero-btn" onclick="openForm()">Anmäl dig nu</button>
    </div>
  </section>


  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeForm()">&times;</span>
      <h1>Book cirkel Club</h1>


      <!-- Video or image as a header is cool :) -->

      <!-- Signup form -->
      <form id="signup">
        <fieldset>
          <label>
            <span>Namn</span>
            <input type="text" placeholder="Enter your name" name="namn" />
          </label>
          <label>
            <span>Email</span>
            <input type="text" placeholder="Enter your email" name="email" />
          </label>
          <label>
            <span>Adress</span>
            <input type="text" placeholder="Enter your adress" name="adress" />
          </label>
          <label>
            <span>Stad</span>
            <input type="text" placeholder="Enter your city" name="stad" />
          </label>
          <label>
            <span>Postadress</span>
            <input type="text" placeholder="Enter your postcode" name="postadress" />
          </label>
          <span> Välj en bok </span>
          <select name="Bok">
            <option value="därskugg"> Där skuggorna försvinner</option>
            <option value="därskugg"> Vem är där </option>
            <option value="därskugg"> När jag dör</option>
            <option value="därskugg"> Gröna tranbär</option>
          </select>
          </label>
          <div class="button">
            <button type="button">Bekräfta</button>
          </div>
        </fieldset>
      </form>
    </div>
  </div>

  <script>
    function openForm() {
      document.getElementById("modal").style.display = "block";
    }

    function closeForm() {
      document.getElementById("modal").style.display = "none";
    }
  </script>


</body>

</html>
